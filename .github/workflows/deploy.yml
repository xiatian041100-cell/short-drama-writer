# 前端部署配置
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install and Build
        working-directory: ./frontend
        run: |
          # 创建临时package.json确保依赖正确安装
          npm init -y
          npm install react@18.2.0 react-dom@18.2.0 react-router-dom@6.20.0 axios@1.6.0 lucide-react@0.294.0 clsx@2.0.0
          npm install --save-dev vite@5.0.0 @vitejs/plugin-react@4.2.0 tailwindcss@3.3.5 postcss@8.4.31 autoprefixer@10.4.16
          npx vite build
        env:
          VITE_API_URL: ${{ secrets.API_URL || 'https://api.example.com/api' }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
